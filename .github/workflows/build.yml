name: Build catalog and deploy

on:
  repository_dispatch:
    types: [catalog-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'manifest.json'
      - 'catalog/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CATALOG_REPO: https://github.com/adventure-voter/catalog.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Clone catalog
        run: git clone --no-tags "$CATALOG_REPO" "$RUNNER_TEMP/catalog"

      - name: Build catalog
        run: go run ./tools/catalog-build -catalog "$RUNNER_TEMP/catalog" -out .

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json catalog
          if git diff --cached --quiet; then
            echo "catalog unchanged, nothing to commit"
          else
            git commit -m "chore: rebuild catalog [skip ci]"
            git push
          fi

      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.json _site/
          cp -r assets catalog _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
